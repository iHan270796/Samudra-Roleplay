<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samudra HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud">
        <div class="top-info">
            <div class="datetime">
                <div class="time" id="time">11:50</div>
                <div class="date" id="date">01/16/2025</div>
            </div>

            <div class="logo-area">
                <img src="logo.png" class="logo" alt="Logo">
                <div class="server-name">
                    <div class="title">SAMUDRA</div>
                    <div class="subtitle">ROLEPLAY</div>
                </div>
            </div>
        </div>

        <div class="mid-info">
            <div class="money">
                <span class="cash">$48,263</span>
                <span class="bank">$5,270</span>
            </div>

            <div class="job-info">
                <span class="gang">No Gang</span>
                <span class="job">Civilian - Freelancer</span>
                <span class="id" id="playerName">samudra (1)</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
