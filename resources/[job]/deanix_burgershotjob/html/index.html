<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Burgershot UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-panel" id="layout1" style="display: none; flex-direction: column;">
        <div id="daftarMakanan">
            <h3>Menu Makanan</h3>
            <div id="makananList" class="scroll-list"></div>
        </div>
        <hr style="border-color: #2980b9; margin: 10px 0;">
        <div id="queueProgress">
            <h3>Antrian</h3>
            <div id="queueItem">Tidak ada proses</div>
            <div id="queueBar" class="progress-bar" style="display: none;">
                <div id="queueFill" class="progress-fill"></div>
            </div>
        </div>
    </div>
    <div class="right-panel" id="layout2" style="display: none; flex-direction: column;">
    <div id="bahanSection">
        <h3>Daftar Makanan</h3>
        <div id="bahanList" class="scroll-list"></div>
        <button id="btnTambahTroli" class="btn" style="margin-top: 10px;">Tambakan Ke keranjang</button>
    </div>

    <hr style="border-color: #2980b9; margin: 10px 0;">

    <div id="historySection" style="display: none;">
        <h3>History</h3>
        <div id="historyList" class="scroll-list"></div>
    </div>

    <div id="historySectionCustomer" style="display: none;">
        <h3>History Pesanan</h3>
        <div id="historyListCustomer" class="scroll-list"></div>
    </div>
    </div>
    <div class="center-panel" id="layout3" style="display: none;">
        <h3>Keranjang</h3>
        <div id="troliList" class="scroll-list"></div>
        <button id="btnBayar" class="btn" style="margin-top: 10px;">Konfirmasi</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
