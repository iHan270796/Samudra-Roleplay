<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fleeca Bank UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Layout Kiri (Ambil Kode + Queue/Close) -->
    <div class="left-panel" id="layout1" style="display: none;">
        <h2 style="text-align: center;">Terminal Akses</h2>
        <button id="ambilKodeBtn" style="padding: 15px; font-size: 18px;">Ambil Kode</button>
        <p id="queueStatus" style="margin: 0; text-align: center;">Menunggu pengambilan kode...</p>
        <div id="queueBar" style="height: 25px; background: #444; border-radius: 10px; overflow: hidden;">
            <div id="queueProgress" style="height: 100%; width: 0%; background: #3498db;"></div>
        </div>
    </div>

    <!-- Layout Kanan (Kode Entri) -->
    <div class="right-panel" id="layout2" style="display: none;">
        <h2 style="text-align: center;">Kode Sistem</h2>
        <div id="kodeDisplay" style="font-size: 32px; text-align: center; margin-top: 50px;">------</div>
    </div>

    <!-- Layout Tengah (Input Kode) -->
    <div class="center-panel" id="layout3" style="display: none;">
        <h2 style="text-align: center;">Masukkan Kode</h2>
        <input id="codeInput" type="text" maxlength="6" placeholder="######" style="
            font-size: 32px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
        ">
        <button id="submitCodeBtn" style="margin-top: 20px; padding: 15px; font-size: 18px;">Konfirmasi</button>
    </div>

    <!-- Layout Ambil Uang -->
    <div class="center-panel" id="layout4" style="display: none;">
        <h2 style="text-align: center;">Ambil Uang</h2>
        <img id="rewardImage" src="" alt="Reward Image">
        <div id="rewardLabel" style="font-size: 20px;">Reward</div>
        <button id="ambilRewardBtn" style="margin-top: 20px; padding: 15px; font-size: 18px;">Ambil</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
