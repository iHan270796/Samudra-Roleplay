<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <link rel="shortcut icon" type="image/ico" href="/src/assets/favicon.ico" />
  <title>Samudra Roleplay</title>
  <script type="module" crossorigin src="./assets/index-2e4e5b91.js"></script>
  <link rel="stylesheet" href="./assets/index-bd2ec4b9.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* YouTube background styling */
    .youtube-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      pointer-events: none;
    }

    /* Optional video tag hiding */
    video {
      display: none !important;
    }

    /* Info text (optional) */
    #muteText {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- ✅ YouTube Background -->
  <iframe
    class="youtube-bg"
    src="https://www.youtube.com/embed/Wz11uLmslsk?autoplay=1&mute=1&controls=0&loop=1&playlist=Wz11uLmslsk&modestbranding=1&showinfo=0&rel=0"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>

  <!-- ✅ Musik lokal dari folder assets -->
  <audio id="bgMusic" autoplay loop hidden>
    <source src="./assets/music.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- ✅ Optional text untuk kontrol -->
  <div id="muteText">PRESS SPACE TO MUTE/UNMUTE MUSIC</div>

  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
    const bgMusic = document.getElementById('bgMusic');

    // Play musik setelah delay kecil (untuk autoplay izin browser)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        bgMusic.play().catch(e => {
          console.warn('Autoplay blocked, waiting for user interaction');
        });
      }, 300);
    });

    // Toggle play/pause dengan tombol Space
    document.addEventListener('keydown', function(event) {
      if (event.code === 'Space') {
        event.preventDefault();
        if (bgMusic.paused) {
          bgMusic.play();
        } else {
          bgMusic.pause();
        }
      }
    });
  </script>
</body>
</html>
