<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>UI Jual Barang</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body style="display: none;">
  <!-- KIRI: List Item + Antrian -->
  <div class="left-panel">
    <div class="item-sidebar" id="item-list"></div>
    <div class="queue" id="queue">
      <h3>Antrian Penjualan</h3>
    </div>
  </div>

  <!-- KANAN: Detail Item + Kontrol + Riwayat -->
  <div class="right-panel hidden" id="item-details">
    <div class="detail-top">
      <img id="item-image" src="" alt="Item Image">
      <h2 id="item-label">Item Name</h2>
      <p id="item-price">$0</p>
    </div>

    <div class="controls">
      <button onclick="adjustQty(-1)"><i class="fas fa-minus"></i></button>
      <span id="qty">0</span>
      <button onclick="adjustQty(1)"><i class="fas fa-plus"></i></button>
    </div>

    <button class="sell-button" onclick="sellSelectedItem()" id="sell-btn">
      <i class="fas fa-cash-register"></i>
      <span id="sell-text">Jual</span>
      <span id="sell-spinner" class="spinner" style="display: none;"></span>
    </button>

    <div class="history" id="history">
      <h3>Riwayat Penjualan</h3>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
